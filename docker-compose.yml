services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c log_statement=none
        -c log_min_duration_statement=500
        -c deadlock_timeout=1s
        -c log_lock_waits=on
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d

volumes:
  pgdata:
