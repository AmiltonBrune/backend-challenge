services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c log_statement=none
        -c log_min_duration_statement=500
        -c deadlock_timeout=1s
        -c log_lock_waits=on
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports: ["3200:3200", "4317:4317", "4318:4318"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3030:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo

  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    command: ["bun", "run", "scripts/migration-run.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports: ["3000:3000"]
    environment:
      APP_ROLE: api
      PORT: "3000"
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tempo:
        condition: service_started

  consumer:
    build: .
    environment:
      APP_ROLE: consumer
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      CONSUMER_NAME: wager-consumer
      LOG_LEVEL: info
      METRICS_PORT: "9464"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tempo:
        condition: service_started

  worker:
    build: .
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events
      LOG_LEVEL: info
      METRICS_PORT: "9464"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tempo:
        condition: service_started

volumes:
  pgdata:
